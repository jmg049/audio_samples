name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Lint levels are configured via the [lints] table in Cargo.toml; `-D
      # warnings` is scoped to the clippy step (not a global RUSTFLAGS) so it
      # does not force every test/doc/build job to treat warnings as errors.
      # chunks_exact_to_as_chunks is new in clippy 1.99 and flags 12 hot loops. It is
      # allowed here rather than in Cargo.toml, where older toolchains reject the name.
      - run: cargo clippy --all-targets --features full_no_plotting -- -D warnings -A clippy::chunks_exact_to_as_chunks
      - run: cargo clippy --all-targets --features full -- -D warnings -A clippy::chunks_exact_to_as_chunks

  test:
    name: test (${{ matrix.features }})
    # librosa_reference's float32 time_stretch check fails with the glibc 2.39 of
    # ubuntu-24.04 (7.2e-7 against a 6.2e-7 bound) and passes with 2.43.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""                       # bare-bones (default)
          - "full_no_plotting"
          - "full"
          - "psychoacoustic random-generation"
          - "opus-codec random-generation"
          - "simd full_no_plotting"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: test
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -z "$FEATURES" ]; then
            cargo test --no-default-features
          else
            cargo test --features "$FEATURES"
          fi

  doc:
    name: doc
    runs-on: ubuntu-24.04
    # Docs must build warning-free: any rustdoc warning (broken intra-doc link,
    # redundant link target, bare URL, …) fails the build.
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --no-deps --features full_no_plotting
      # rustdoc 1.99 reports one redundant link with no source location under this
      # feature set, which it does not report in full_no_plotting.
      - run: cargo doc --no-deps --features full
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::redundant_explicit_links

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --features full_no_plotting

  feature-powerset:
    name: feature powerset (hack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Exclude plotting/static-plots (heavy, pull a browser stack) and
      # educational (pulls `open`); they are covered by the `full` test job.
      - run: >
          cargo hack check --feature-powerset --depth 2 --no-dev-deps
          --exclude-features plotting,static-plots,educational,html_view,python
