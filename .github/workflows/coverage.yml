# Runs the tests under cargo-llvm-cov and uploads the result to Codecov. A failed
# upload fails the job on main, where it needs the CODECOV_TOKEN secret, and not on
# pull requests, which upload without a token.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # cargo-llvm-cov tries to run the empty rustc-wrapper this file sets.
      - name: Remove the local Cargo configuration
        run: rm .cargo/config.toml
      - run: cargo llvm-cov --features full_no_plotting --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: ${{ github.event_name == 'push' }}
          token: ${{ secrets.CODECOV_TOKEN }}
