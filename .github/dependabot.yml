# tests/reference/librosa is left out: its exact pins are the versions that
# produced the committed golden fixtures.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/book/figures"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/tests/reference"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
