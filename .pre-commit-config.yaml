# Pre-commit hooks (https://pre-commit.com).
#
#   pre-commit install            # once per clone
#   pre-commit run --all-files    # run everything manually
#
# The reference hooks guard the golden-reference test suites: any change to the
# filter code, the fixtures or the fixture generator must keep audio_samples in
# agreement with SciPy / FFmpeg / DSPFilters / liquid-dsp, and any change to the
# librosa-compatible analysis code must keep it in agreement with librosa.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: filter-reference-tests
        name: filter reference tests (SciPy / FFmpeg / DSPFilters / liquid-dsp fixtures)
        entry: tests/reference/hooks/check_filters.sh
        language: system
        pass_filenames: false
        files: ^(src/operations/(iir_design|iir_filtering|parametric_eq|processing|types|traits)\.rs|src/traits\.rs|src/conversions\.rs|tests/filter_reference\.rs|tests/fixtures/filters/.*|Cargo\.toml)$

      - id: filter-fixtures-fresh
        name: filter fixtures match their generator
        entry: tests/reference/hooks/check_filter_fixtures.sh
        language: system
        pass_filenames: false
        files: ^(tests/reference/.*|tests/fixtures/filters/.*)$

      - id: librosa-reference-tests
        name: librosa reference tests (librosa 1.0 golden fixtures)
        entry: tests/reference/hooks/check_librosa.sh
        language: system
        pass_filenames: false
        files: ^(src/operations/(spectrum|filterbanks|features|tonal|constant_q|rhythm|effects|pitch_tracking|sequence|transforms|statistics|processing|editing|channels|hpss|pitch_analysis|beat|peak_picking|types|traits|mod|onset/.*)\.rs|src/(resampling|conversions|traits|repr|lib)\.rs|src/utils/(audio_math|mod)\.rs|tests/librosa_reference/.*|tests/fixtures/librosa/.*|Cargo\.toml)$

      - id: librosa-fixtures-fresh
        name: librosa fixtures match their generator
        entry: tests/reference/hooks/check_librosa_fixtures.sh
        language: system
        pass_filenames: false
        files: ^(tests/reference/librosa/.*|tests/fixtures/librosa/.*)$

      - id: educational-material
        name: learning guide doctests, explain API and tutorial labs
        entry: tests/reference/hooks/check_educational.sh
        language: system
        pass_filenames: true
        files: ^(src/educational/.*|src/guide\.rs|documentation/guide/.*|examples/tutorial_.*\.rs|tests/explain_api\.rs|tests/educational_integration\.rs)$
