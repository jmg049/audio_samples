# Pre-commit hooks (https://pre-commit.com).
#
#   pre-commit install            # once per clone
#   pre-commit run --all-files    # run everything manually
#
# The reference hooks guard the golden-fixture test suites: any change to the
# filter code, the analysis code, the fixtures or a fixture generator must keep
# audio_samples within the stated tolerances of the reference values.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      # Every warning is an error. The two feature sets cover the library with
      # and without plotting, the learning guide and every test, bench and
      # example.
      - id: cargo-clippy
        name: cargo clippy (every warning is an error)
        entry: bash -c 'cargo clippy --all-targets --features educational,full_no_plotting -- -D warnings && cargo clippy --all-targets --features full -- -D warnings'
        language: system
        pass_filenames: false
        files: ^(src/.*\.rs|tests/.*\.rs|benches/.*\.rs|examples/.*\.rs|build\.rs|build_support/.*\.rs|Cargo\.(toml|lock))$

      - id: filter-reference-tests
        name: filter reference tests (golden fixtures)
        entry: tests/reference/hooks/check_filters.sh
        language: system
        pass_filenames: false
        files: ^(src/operations/(iir_design|iir_filtering|parametric_eq|processing|types|traits)\.rs|src/traits\.rs|src/conversions\.rs|tests/filter_reference\.rs|tests/fixtures/filters/.*|Cargo\.toml)$

      - id: filter-fixtures-fresh
        name: filter fixtures match their generator
        entry: tests/reference/hooks/check_filter_fixtures.sh
        language: system
        pass_filenames: false
        files: ^(tests/reference/.*|tests/fixtures/filters/.*)$

      - id: analysis-reference-tests
        name: analysis reference tests (golden fixtures)
        entry: tests/reference/hooks/check_analysis.sh
        language: system
        pass_filenames: false
        files: ^(src/operations/(spectrum|filterbanks|features|tonal|constant_q|rhythm|effects|pitch_tracking|sequence|transforms|statistics|processing|editing|channels|hpss|pitch_analysis|beat|peak_picking|linalg|inverse|factorization|pitch_filterbank|mellin|segment|iir_design|types|traits|mod|onset/.*)\.rs|src/(resampling|conversions|traits|repr|lib)\.rs|src/utils/(audio_math|array_ops|notation|mod)\.rs|tests/analysis_reference/.*|tests/fixtures/analysis/.*|Cargo\.toml)$

      - id: analysis-fixtures-fresh
        name: analysis fixtures match their generator
        entry: tests/reference/hooks/check_analysis_fixtures.sh
        language: system
        pass_filenames: false
        files: ^(tests/reference/analysis/.*|tests/fixtures/analysis/.*)$

      - id: educational-material
        name: learning guide doctests, explain API and tutorial labs
        entry: tests/reference/hooks/check_educational.sh
        language: system
        pass_filenames: true
        files: ^(src/educational/.*|src/guide\.rs|build\.rs|build_support/.*|documentation/guide/.*|examples/tutorial_.*\.rs|tests/explain_api\.rs|tests/educational_integration\.rs)$

      - id: doc-maths
        name: documentation maths (rustdoc escaping, guide round trip)
        entry: tests/reference/hooks/check_doc_maths.sh
        language: system
        pass_filenames: true
        files: ^(src/.*\.rs|documentation/guide/.*\.md|build\.rs|build_support/.*|tests/guide_math_roundtrip\.rs|tests/reference/hooks/check_(doc_math|guide_rustdoc_math)\.py)$

      - id: book
        name: learning guide mdBook (figures, examples, KaTeX, links)
        entry: tests/reference/hooks/check_book.sh
        language: system
        pass_filenames: false
        files: ^(book/.*|documentation/guide/.*|examples/.*)$
