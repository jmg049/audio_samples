[project]
name = "audio-samples-librosa-reference"
version = "0.1.0"
description = "Golden-fixture generator for the audio_samples analysis test suite"
requires-python = ">=3.12"
# Exact pins: `*.lock` is gitignored in this repository, so the versions that
# produced the committed fixtures are pinned here.
dependencies = [
    "librosa==1.0.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "soxr==1.1.0",
    "numba==0.68.0",
    "scikit-learn==1.9.1",
]

[tool.uv]
package = false
